Settings:
  # noinspection SpellCheckingInspection
  Prefix: '&8[#4ec483&lPUUIDs&8]'
  Update-Checking: true
  Cooldowns:
    On-Time:
      Enabled: true
      Seconds: 5
  File-Cleanup:
    Enabled: true
    Clean-Essentials: true
    Max-Days: 365
  Metrics: true
  Debug: false
Messages:
  No-Permission: '&c&lSorry! &fYou are not able to do that.'
# Optionally mirror everything in the Data folder into MySQL.
#
# The .yml files stay in charge: every read still comes off disk, so this can never slow a
# plugin down or fail because the database is busy. Each write is copied up in the background
# instead, giving you one place to back up, query, or share between the servers on a network.
#
# One table is created per plugin (puuids_data_<plugin>), alongside puuids_players for
# usernames / IPs / play time and puuids_plugins listing which table belongs to which plugin.
#
# Your server needs a MySQL or MariaDB JDBC driver on its classpath. Most Spigot and Paper
# builds ship one; if yours doesn't, puuids says so in the console and keeps saving to file.
MySQL:
  Enabled: false
  Host: localhost
  Port: 3306
  Database: minecraft
  Username: root
  Password: ''
  # Every table puuids creates starts with this. Letters, numbers and underscores only.
  Table-Prefix: 'puuids_'
  Use-SSL: false
  # Passed straight to the driver, e.g. 'allowPublicKeyRetrieval=true&serverTimezone=UTC'.
  # MySQL 8 with caching_sha2_password over an unencrypted link needs the first of those.
  Extra-Properties: ''
  # How long to wait on the database before giving up. The server start-up waits on this once.
  Connection-Timeout-Seconds: 10
  Pool-Size: 3
  # How often queued changes are sent, in milliseconds.
  Flush-Rate-Ms: 1000
  # If the database goes away, changes wait in memory up to this many before the oldest are
  # dropped. Nothing is lost from your files - run /puuids mysql export to rebuild afterwards.
  Max-Queued-Writes: 100000
  # Rebuild the Data folder from MySQL at start-up. For a server whose data lives in the
  # database (a fresh network member, or one being restored) - it overwrites local files.
  Import-On-Startup: false
  # Push the whole Data folder up at start-up. Handy the first time you switch MySQL on;
  # /puuids mysql export does the same thing on demand.
  Export-On-Startup: false
  # Refresh a player's file from MySQL as they join, for networks where their data follows them
  # between servers. Their local file wins wherever it has seen them more recently.
  Sync-On-Join: false
Advanced:
  # Only mess with the following if you are sure as to what you're doing.
  Save-Rate-Ticks: 10
  Max-Processes-Per-Queue: 25
  # How often every online player's file is checkpointed, in seconds. A normal quit always
  # saves play time exactly; this only limits how much of a session is lost in a hard crash.
  Player-Update-Seconds: 300
  Allow-Post-Startup-Connections: false
  Allow-Unsafe-Reloads: false
  UUID: "0"